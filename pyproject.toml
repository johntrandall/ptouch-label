[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ptouch-label"
version = "0.1.0"
description = "Print labels on Brother P-touch network label printers (PT-P750W, PT-P950NW) from the command line or any macOS print dialog."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "John Randall" }]
keywords = ["brother", "p-touch", "label-printer", "pt-p750w", "pt-p950nw", "ipp-everywhere", "cups"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Printing",
]
dependencies = [
  "Pillow",
  # ptouch >=1.1 imports `usb.core` at module-load time even though pyusb is
  # an optional extra upstream; install it so the network path loads.
  "ptouch>=1.1",
  "pyusb",
]

[project.scripts]
ptouch-label = "ptouch_label:main"

[project.urls]
Homepage = "https://github.com/johntrandall/ptouch-label"
Issues = "https://github.com/johntrandall/ptouch-label/issues"

[tool.hatch.build.targets.wheel]
only-include = ["ptouch_label.py"]

[tool.hatch.build.targets.sdist]
include = ["ptouch_label.py", "README.md", "LICENSE", "contrib/", "docs/*.md", "pyproject.toml"]
